# =========================
# Default / PROD (DigitalOcean)
# - HTTP only inside container (DO provides HTTPS at the edge)
# - Port comes from $PORT
# - OAuth2 creds & tenant come from env vars
# =========================
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        secure: true
        same-site: none

spring:
  datasource:
    url: ${JDBC_URL:}
    username: ${DB_USER:}
    password: ${DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - offline_access
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
            user-name-attribute: name

matrix:
  container: ${MATRIX_CONTAINER:matrices}
  api:
    base-url: ${MATRIX_API_BASE_URL:https://api.amo.onl}
    payment-path: ${MATRIX_API_PAYMENT_PATH:/payment}
    blobs-path: ${MATRIX_API_BLOBS_PATH:/matrix/blobs}

app:
  timezone: ${APP_TIMEZONE:Europe/Brussels}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: local-ssl

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: ${KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: amospringboot